name: Sync CL Match Results

on:
  schedule:
    # CL spilles tirsdag/onsdag med afspark 16:45-17:45 og 19:00-20:00 UTC.
    # Kampene er slut 18:45-22:15 (senere ved forlaenget spilletid), saa vi
    # synkroniserer hver halve time i det vindue.
    - cron: "0,30 18-22 * * 2,3"
    - cron: "0 23 * * 2,3"
    # Finalen spilles en loerdag aften.
    - cron: "0,30 20-22 * * 6"
    # Daglig opsamling kl. 08:00 dansk tid (= 06:00 UTC under CEST).
    # Vercel-cron koerer den samme sync 06:30 UTC (vercel.json). Overlappet er
    # med vilje: GitHub slaar planlagte workflows fra efter 60 dage uden
    # aktivitet i repoet, og syncen er idempotent, saa to koersler skader intet.
    - cron: "0 6 * * *"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger match sync
        run: |
          response=$(curl -s -w "\n%{http_code}" -X GET \
            "https://cl-auktion.vercel.app/api/sync-matches-cl")
          status=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Response: $body"
          if [ "$status" != "200" ]; then
            echo "Sync failed with status $status"
            exit 1
          fi
